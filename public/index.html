<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUShield Test Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
            color: #111827;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #2563eb; }
        .log-area {
            margin-top: 30px;
            padding: 15px;
            background: #1f2937;
            color: #10b981;
            border-radius: 6px;
            font-family: monospace;
            min-height: 100px;
        }
    </style>

    <script 
        src="./banner.js" 
        data-project="3fa85f64-5717-4562-b3fc-2c963f66afa6"
        data-lang="it"
        data-theme="dark"
        data-pos="modal"
        defer>
    </script>
    </head>
<body>

    <div class="container">
        <h1>Welcome to My Awesome Shop</h1>
        <p>This is a test page to simulate a client's website.</p>
        <p>If the EUShield script is working, you should see the cookie banner popup based on the configuration in the <code>&lt;head&gt;</code>.</p>
        
        <div class="log-area" id="event-log">
            // EUShield Event Log:<br>
            // Waiting for user action...
        </div>
    </div>

    <script>
        const logArea = document.getElementById('event-log');

        // Listen for the ACCEPT event
        window.addEventListener('eushield_consent_accepted', () => {
            logArea.innerHTML += '<br><br>> EVENT RECEIVED: eushield_consent_accepted';
            logArea.innerHTML += '<br>> Action: Firing Google Analytics tags...';
            logArea.innerHTML += '<br>> Action: Firing Meta Pixel...';
            // Here the client would actually initialize their trackers
        });

        // Listen for the REJECT event
        window.addEventListener('eushield_consent_rejected', () => {
            logArea.innerHTML += '<br><br>> EVENT RECEIVED: eushield_consent_rejected';
            logArea.innerHTML += '<br>> Action: Trackers blocked. Respecting user privacy.';
        });
    </script>

</body>
</html>
